<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>車両ビューア</title>
<!-- scene/trains.js の見た目確認用(開発ツール)。ローカルHTTPサーバで開く:
     http://localhost:8125/tools/train-viewer.html?view=front|side|rear|chase|top&night=1&q=high|mid|low -->
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #info {
    position: fixed; left: 10px; top: 8px; color: #dfe6ec; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
    background: rgba(0, 0, 0, 0.45); padding: 6px 9px; border-radius: 4px; pointer-events: none; white-space: pre;
  }
  #bar { position: fixed; right: 10px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  #bar a {
    color: #dfe6ec; background: rgba(0, 0, 0, 0.5); padding: 5px 9px; border-radius: 4px; text-decoration: none;
    font: 12px ui-monospace, Menlo, Consolas, monospace; touch-action: manipulation;
  }
  body.shot #info, body.shot #bar { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info">loading…</div>
<div id="bar"></div>
<script type="module" src="./train-viewer.js"></script>
</body>
</html>
